[package]
name = "acteur"
version = "1.0.0"
authors = ["David Bonet <webbonet@gmail.com>"]
edition = "2018"
description = "A safe actor-like framework that just works. Simple, robust, fast, documented."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DavidBM/acteur-rs"
readme = "README.md"
keywords = ["actor", "messages", "actors", "async", "system"]
categories = ["asynchronous", "concurrency"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
async-trait = "0.1"
async-global-executor = "3.1"
async-io = "2"
async-lock = "3"
futures-lite = "2"
event-listener = "5"
dashmap = "6"
futures = "0.3"
lazy_static = "1"
num_cpus = "1.13"
async-channel = "2"
